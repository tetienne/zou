name: Verify and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, without cancelling the one in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Quality and verification run in parallel: a style error must not mask a
  # broken test, nor the other way round.
  quality:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Formatting (Prettier)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

  verify:
    name: Types, tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build the site
        run: npm run build
        env:
          # GitHub Pages serves the site under /<repository-name>/.
          VITE_BASE: /${{ github.event.repository.name }}/

      - name: Prepare the Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Only Chromium: these tests are about our own plumbing — the worker pool,
      # the pagination, the copy — not about browser differences.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Playwright builds the site and serves it itself; see playwright.config.ts.
      # It has to be the built site: the worker URL and the `.wasm` path are
      # rewritten at build time.
      - name: Browser tests (Playwright)
        run: npm run test:browser

      - name: Keep the trace of a failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  deploy:
    name: Publish
    needs: [quality, verify, browser]
    # Anything but a pull request publishes: that means a push to one of the
    # branches listed under `on.push.branches`, or a manual run. Keeping the
    # branch list in one place avoids a second copy of it here.
    #
    # There is only one Pages site, so publishing a branch REPLACES what is
    # online. GitHub gates this separately: the github-pages environment only
    # accepts the default branch until the branch is allowed under
    # Settings → Environments → github-pages → Deployment branches.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      # deploy-pages resolves the artifact through the Actions API.
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
