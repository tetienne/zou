<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aperçu partagé de Zou</title>
    <style>
      /* 1200 × 630 is what every chat app and social network crops to. The
         colours, the shapes and the two faces are the ones of the site itself —
         ruled cream paper, a note taped to it, ink blue and the red of the
         margin — so the preview and the page a click later look like the same
         thing.

         The values below are copies of the theme in src/style.css rather than
         imports: this file is rendered on its own, straight from disk, with no
         Tailwind and no build step. A change to the palette has to be carried
         here by hand, and the picture regenerated. */

      /* The site bundles its faces for a school machine behind a proxy; this
         card reads the very same files, so the preview is set in the voice the
         page speaks. Chrome only opens them with --allow-file-access-from-files,
         which build-og-image.js passes. */
      @font-face {
        font-family: 'Fraunces';
        font-weight: 700;
        src: url('../node_modules/@fontsource/fraunces/files/fraunces-latin-700-normal.woff2') format('woff2');
      }

      @font-face {
        font-family: 'Karla';
        font-weight: 400;
        src: url('../node_modules/@fontsource/karla/files/karla-latin-400-normal.woff2') format('woff2');
      }

      @font-face {
        font-family: 'Karla';
        font-weight: 700;
        src: url('../node_modules/@fontsource/karla/files/karla-latin-700-normal.woff2') format('woff2');
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 1200px;
        height: 630px;
        display: flex;
        /* Wide enough that the tilt of the note, and the crop a chat app adds
           on top of it, never bite into a corner. */
        padding: 56px;
        background-color: #fbf6ec;
        color: #232457;
        font-family: 'Karla', 'Segoe UI', system-ui, sans-serif;
        font-size: 27px;
        line-height: 1.5;
        /* The Seyès ruling of the site, at the same 4:1 rhythm. */
        background-image:
          repeating-linear-gradient(to bottom, transparent 0 27px, #cddcee 27px 28px),
          repeating-linear-gradient(to bottom, transparent 0 111px, #b0c8e2 111px 112px),
          repeating-linear-gradient(to right, transparent 0 27px, rgb(176 200 226 / 0.35) 27px 28px);
      }

      /* The note the two pages are: taped to the paper, tilted, held down the
         left edge by the ink rule. */
      .note {
        position: relative;
        flex: 1;
        display: flex;
        align-items: center;
        gap: 56px;
        padding: 56px 64px;
        border: 1px solid #7e7d96;
        border-left: 8px solid #232457;
        border-radius: 6px;
        background: #fffdf7;
        box-shadow: 0 1px 3px rgb(35 36 87 / 0.12);
        transform: rotate(-0.5deg);
      }

      .note::before {
        content: '';
        position: absolute;
        top: -14px;
        left: 50%;
        width: 132px;
        height: 30px;
        background: #e2cd98;
        border-inline: 1px dashed rgb(120 100 55 / 0.35);
        transform: translateX(-50%) rotate(-2.5deg);
      }

      .text {
        flex: 1;
      }

      .stamp {
        display: block;
        transform: rotate(-4deg);
      }

      h1 {
        margin-top: 26px;
        font-family: 'Fraunces', Georgia, 'Times New Roman', serif;
        font-size: 56px;
        font-weight: 700;
        line-height: 1.15;
        letter-spacing: -0.015em;
      }

      p {
        margin-top: 20px;
        color: #56548a;
      }

      .points {
        display: flex;
        gap: 14px;
        align-items: baseline;
        margin-top: 30px;
        padding-top: 20px;
        border-top: 1px dashed #cbc3ae;
        font-size: 21px;
        font-weight: 700;
        color: #a8352b;
      }

      .points span {
        padding: 8px 18px;
        white-space: nowrap;
        border: 1px solid #cbc3ae;
        border-radius: 999px;
        background: #fbe8e3;
      }

      /* The label the home page pins beside its title, drawn at the size a
         preview can carry. Its ink, its tint, its drawing and its code are put
         here by build-og-image.js, from the same functions the sheet is printed
         with — the one thing on this page that is not a copy of the theme. */
      .label {
        flex-shrink: 0;
        width: 268px;
        padding: 16px;
        border: 3px dashed var(--ink);
        border-radius: 22px;
        background: var(--tint);
        text-align: center;
        transform: rotate(-2deg);
      }

      /* The white patch a code is read off, kept even here: the preview shows
         the thing that gets printed, not a drawing of it. */
      .label-qr {
        padding: 12px;
        border-radius: 16px;
        background: #ffffff;
        color: var(--ink);
      }

      .label-qr svg {
        display: block;
        width: 100%;
        height: auto;
      }

      .label-name {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.3em;
        margin-top: 12px;
        font-size: 34px;
        font-weight: 700;
        line-height: 1.2;
        color: var(--ink);
      }
    </style>
  </head>
  <body>
    <div class="note">
      <div class="text">
        <!-- The stamp on the cover of an exercise book, as the header sets it. -->
        <svg class="stamp" width="172" height="120" viewBox="0 0 132 92" role="img" aria-label="Zou">
          <rect x="4" y="4" width="124" height="84" rx="4" fill="none" stroke="#a8352b" stroke-width="3" />
          <rect
            x="11"
            y="11"
            width="110"
            height="70"
            rx="2"
            fill="none"
            stroke="#a8352b"
            stroke-width="1.5"
            stroke-dasharray="5 4"
          />
          <text
            x="66"
            y="52"
            text-anchor="middle"
            font-family="Fraunces, Georgia, serif"
            font-size="34"
            font-weight="700"
            fill="#232457"
          >
            Zou
          </text>
          <text
            x="66"
            y="70"
            text-anchor="middle"
            font-family="Karla, sans-serif"
            font-size="9"
            letter-spacing="2.5"
            fill="#a8352b"
          >
            CLASSE
          </text>
        </svg>
        <h1>Ranger les photos des travaux d'élèves</h1>
        <p>Une étiquette QR à côté du travail, une photo, et chaque image part dans le dossier du bon enfant.</p>
        <div class="points">
          <span>Gratuit</span>
          <span>Sans installation</span>
          <span>Rien ne quitte l'ordinateur</span>
        </div>
      </div>
      <!-- Four holes the script fills, and the reason the file cannot simply be
           opened in a browser: what a teacher would print for this first name,
           down to the code itself, rather than a drawing of it. -->
      <div class="label" style="--ink: %INK%; --tint: %TINT%">
        <div class="label-qr">%QR%</div>
        <div class="label-name"><span aria-hidden="true">%MASCOT%</span><span>%NAME%</span></div>
      </div>
    </div>
  </body>
</html>
