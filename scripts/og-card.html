<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aperçu partagé de Zou</title>
    <style>
      /* 1200 × 630 is what every chat app and social network crops to. The
         colours and the shapes are the ones of the site itself — slate-50
         background, white card, blue-700 ink — so the preview and the page a
         click later look like the same thing. */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 1200px;
        height: 630px;
        display: flex;
        padding: 40px;
        background: #f8fafc;
        color: #0f172a;
        font-family: system-ui, 'Segoe UI', 'Liberation Sans', 'DejaVu Sans', sans-serif;
      }

      .card {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 44px;
        padding: 48px 56px;
        border: 2px solid #cbd5e1;
        border-radius: 32px;
        background: #ffffff;
      }

      .text {
        flex: 1;
      }

      .eyebrow {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: #1d4ed8;
      }

      h1 {
        margin-top: 18px;
        font-size: 54px;
        font-weight: 800;
        line-height: 1.1;
        letter-spacing: -0.015em;
      }

      p {
        margin-top: 22px;
        font-size: 27px;
        line-height: 1.4;
        color: #475569;
      }

      .points {
        display: flex;
        gap: 14px;
        margin-top: 32px;
        font-size: 20px;
        font-weight: 600;
        color: #1d4ed8;
      }

      .points span {
        padding: 9px 18px;
        white-space: nowrap;
        border: 2px solid #bfdbfe;
        border-radius: 999px;
        background: #eff6ff;
      }

      /* The favicon, drawn large: the same three finder patterns a teacher is
         about to print onto every label. */
      .mark {
        width: 210px;
        height: 210px;
        flex-shrink: 0;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="text">
        <div class="eyebrow">Zou</div>
        <h1>Ranger les photos des travaux d'élèves</h1>
        <p>Une étiquette QR à côté du travail, une photo, et chaque image part dans le dossier du bon enfant.</p>
        <div class="points">
          <span>Gratuit</span>
          <span>Sans installation</span>
          <span>Rien ne quitte l'ordinateur</span>
        </div>
      </div>
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="6" fill="#1d4ed8" />
        <g fill="#fff">
          <rect x="6" y="6" width="8" height="8" />
          <rect x="18" y="6" width="8" height="8" />
          <rect x="6" y="18" width="8" height="8" />
          <rect x="18" y="18" width="3" height="3" />
          <rect x="23" y="21" width="3" height="3" />
          <rect x="18" y="23" width="3" height="3" />
        </g>
        <g fill="#1d4ed8">
          <rect x="8" y="8" width="4" height="4" />
          <rect x="20" y="8" width="4" height="4" />
          <rect x="8" y="20" width="4" height="4" />
        </g>
      </svg>
    </div>
  </body>
</html>
